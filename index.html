<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Padlet 错落瀑布流洗牌墙</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #000 url('https://v1.padlet.pics/1/image.jpg?t=c_fill,dpr_1,f_jpg,g_center,h_1400,q_85,w_1400&url=https%3A%2F%2Fstorage.googleapis.com%2Fpadlet-uploads-usc1%2F6426320499%2F457479a4d2f209f183cd70ab7f91b4bb%2Fpngtree_happy_birthday_card_background_with_balloons_picture_image_17038118.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow-y: auto; 
      min-height: 100vh; 
      padding: 20px;
    }

    .header {
      color: #333;
      margin-bottom: 20px;
      padding-left: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 28px; font-weight: bold; }
    .header p { font-size: 15px; color: #555; margin-top: 4px; }
    .status-tag { font-size: 13px; background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); padding: 6px 14px; border-radius: 20px; color: #333; font-weight: 500; }

    /* 原生 Padlet 错落瀑布流 Masonry 排版 */
    #wall-container {
      column-count: 5;
      column-gap: 16px;
      width: 100%;
    }

    .card-item {
      break-inside: avoid;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      transition: opacity 0.8s ease, transform 0.8s ease;
      opacity: 1;
    }

    .card-item img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
      display: block;
    }

    .card-title { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 6px; }
    .card-desc { font-size: 14px; color: #333; line-height: 1.4; word-break: break-word; }
    .card-author { font-size: 12px; color: #777; margin-top: 10px; border-top: 1px solid #eee; padding-top: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>生日祝福墙 | Birthday Blessings Wall</h1>
      <p>感谢您的到来，欢迎留下您的祝福和心意 | Thank you being here.</p>
    </div>
    <div id="status" class="status-tag">数据读取中...</div>
  </div>

  <div id="wall-container"></div>

  <script>
    let liveCardPool = [];
    const container = document.getElementById('wall-container');
    const statusEl = document.getElementById('status');

    async function fetchLivePadletData() {
      try {
        // 请求本地 Vercel 后端 API
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error("API 请求失败");

        const xmlText = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "text/xml");
        const items = xml.querySelectorAll("item");

        const list = [];
        items.forEach(item => {
          const title = item.querySelector("title")?.textContent?.replace('Padlet', '')?.trim() || "";
          const desc = item.querySelector("description")?.textContent?.trim() || "";
          const author = item.querySelector("author")?.textContent?.trim() || "匿名";
          
          let imgUrl = item.querySelector("enclosure")?.getAttribute("url") || "";
          if (!imgUrl) {
            const mediaContent = item.getElementsByTagName("media:content")[0];
            if (mediaContent) imgUrl = mediaContent.getAttribute("url") || "";
          }

          if (title || desc || imgUrl) {
            list.push({ title, desc, author, img: imgUrl });
          }
        });

        if (list.length > 0) {
          liveCardPool = list;
          statusEl.innerText = `实时同步中 (${liveCardPool.length} 条祝福)`;
          renderWall();
        }
      } catch (e) {
        console.error(e);
        statusEl.innerText = "数据拉取异常，重试中...";
      }
    }

    function renderWall() {
      if (liveCardPool.length === 0) return;
      container.innerHTML = '';
      
      liveCardPool.forEach((data, index) => {
        const card = document.createElement('div');
        card.className = 'card-item';
        card.id = `card-${index}`;
        
        let imgHtml = data.img ? `<img src="${data.img}" alt="photo">` : '';
        card.innerHTML = `
          ${imgHtml}
          ${data.title ? `<div class="card-title">${data.title}</div>` : ''}
          ${data.desc ? `<div class="card-desc">${data.desc}</div>` : ''}
          <div class="card-author">来自 From: ${data.author}</div>
        `;
        container.appendChild(card);
      });
    }

    // 独立 Shuffle 洗牌
    function startShuffle() {
      setInterval(() => {
        if (liveCardPool.length < 2) return;

        const randomIndex = Math.floor(Math.random() * liveCardPool.length);
        const targetCard = document.getElementById(`card-${randomIndex}`);
        const newData = liveCardPool[Math.floor(Math.random() * liveCardPool.length)];

        if (targetCard) {
          targetCard.style.opacity = '0';
          targetCard.style.transform = 'scale(0.92)';

          setTimeout(() => {
            let imgHtml = newData.img ? `<img src="${newData.img}" alt="photo">` : '';
            targetCard.innerHTML = `
              ${imgHtml}
              ${newData.title ? `<div class="card-title">${newData.title}</div>` : ''}
              ${newData.desc ? `<div class="card-desc">${newData.desc}</div>` : ''}
              <div class="card-author">来自 From: ${newData.author}</div>
            `;
            targetCard.style.opacity = '1';
            targetCard.style.transform = 'scale(1)';
          }, 800);
        }
      }, 3000);
    }

    async function init() {
      await fetchLivePadletData();
      startShuffle();
      // 每 10 秒拉取一次新提交的祝福
      setInterval(fetchLivePadletData, 10000);
    }

    init();
  </script>
</body>
</html>
